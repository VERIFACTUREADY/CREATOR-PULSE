[project]
name = "creator-signal-ai-backend"
version = "0.1.0"
description = "Creator Signal AI — API y motor de análisis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "rq>=2.0",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# Modelos neuronales opcionales. No son necesarios: el motor determinista
# funciona sin ellos. `pip install -e '.[ml]'` los activa.
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.4",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",   # assert: usado en tests
    "B008",   # Depends() en argumentos por defecto es el idioma de FastAPI
    "RUF001", # ambigüedad unicode: los textos en español usan acentos
    "RUF002",
    "RUF003",
    "N818",   # nombres de excepción sin sufijo Error por diseño
    "N811",   # `UUID as PgUUID` es intencionado: distingue el tipo de columna
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"alembic/*" = ["E501"]
"app/services/analysis/lexicons.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: pruebas de integración que usan la base de datos o la API mockeada",
]
filterwarnings = ["ignore::DeprecationWarning"]
